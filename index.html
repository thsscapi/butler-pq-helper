<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://legends.ml/static/images/lib/monster/9400553.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sparrow's BPQ Helper</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (location.hostname === "butler-pq-helper.vercel.app") {
        const destination = new URL(location.href);
        destination.protocol = "https:";
        destination.hostname = "butlerpq.sparrowtools.net";
        const overlay = document.createElement("div");
        overlay.setAttribute("role", "status");
        overlay.style.cssText = "position:fixed;inset:0;z-index:2147483647;display:grid;place-content:center;gap:12px;text-align:center;background:#0b0f14;color:#f3f4f6;padding:24px;font:600 20px system-ui";
        overlay.textContent = "New domain, redirecting…";
        const link = document.createElement("a");
        link.href = destination.href;
        link.style.color = "#fc8500";
        link.textContent = "Continue now";
        overlay.append(link);
        document.body.append(overlay);
        setTimeout(() => location.replace(destination.href), 2000);
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
